# Checks every push and pull request, and builds the store packages on real
# toolchains: Android App Bundle (target API, 16 KB pages) and iOS (Xcode 26).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  checks:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock supabase/functions/*/index.ts
      - run: deno test --no-lock --allow-env supabase/functions/tests/

  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # No key.properties here, so the bundle is debug-signed: it proves the
      # release build works but must not be uploaded to Google Play.
      - run: flutter build appbundle --release
      - name: Target API level is 36 (Android 16) or higher
        run: |
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          target=$(grep -o 'targetSdkVersion="[0-9]*"' "$manifest" | grep -o '[0-9]*')
          echo "targetSdkVersion=$target"
          test "$target" -ge 36
      - name: Native libraries are 16 KB page aligned
        run: |
          unzip -q -o build/app/outputs/bundle/release/app-release.aab 'base/lib/*' -d aab || true
          status=0
          for so in $(find aab -name '*.so'); do
            for align in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((align)) -lt 16384 ]; then echo "Not 16 KB aligned: $so ($align)"; status=1; fi
            done
          done
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-check
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  ios:
    name: iOS build (no signing)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter build ios --release --no-codesign
